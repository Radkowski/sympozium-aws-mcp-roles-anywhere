[project]
name = "sympozium-iam-roles-anywhere-lab"
version = "0.1.0"
description = "Notebook automatyzujący lab AWS IAM Roles Anywhere dla Sympozium (sympuser + symp_role)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
# Zależności potrzebne tylko do uruchomienia notebooka jako kernela Jupyter.
notebook = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.uv]
# Grupa dev instalowana domyślnie przez `uv sync`; do czystego runtime użyj --no-dev.
dev-dependencies = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
